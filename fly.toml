# Fly.io settings. Change "app" to your own unique name (fly launch does this for you).
app = "my-org-checkout"
primary_region = "ord"

[build]

[mounts]
  source = "checkout_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
